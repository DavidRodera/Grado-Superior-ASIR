<!DOCTYPE html>
<html lang="es">
<head>

    <title>Ejercicio 6 - ASIR</title>

</head>
<body>

    <div class="contenedor-principal">
        <h1>ADIVINA EL NÚMERO</h1>

        <div class="input-area">
            <label>Numero:</label>
            <input type="number" id="inputNum">

        <div class="stats">
            <p>INTENTOS REALIZADOS: <span id="listaNumeros"></span></p>
            
            <div class="cuadricula">
                <div class="fila">
                    <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
                    <span>6</span><span>7</span><span>8</span><span>9</span><span>10</span>
                </div>
                <div class="fila marcas" id="marcasIntentos">
                    <span>X</span><span>X</span><span>X</span><span>X</span><span>X</span>
                    <span>X</span><span>X</span><span>X</span><span>X</span><span>X</span>
                </div>
            </div>
        </div>
    </div>

    <script src="ProyectoDOMEventos.js"></script>
</body>
</html>
