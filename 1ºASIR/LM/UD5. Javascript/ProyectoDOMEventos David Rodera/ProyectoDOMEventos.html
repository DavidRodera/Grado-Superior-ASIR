<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 6 - Adivina el Número</title>
    <link rel="stylesheet" href="ProyectoDOMEventos.css">
</head>
<body>

    <div class="contenedor">
        <div class="titulo">
            ADIVINA EL NÚMERO
        </div>

        <table class="tabla">
            <tr>
                <td class="label-numero">Numero:</td>
                <td class="numero">
                    <input type="number" id="Numero" min="1" max="100">
                </td>
                <td class="boton">
                    <button id="botonJugar">Jugar</button>
                </td>
                <td id="recuadroMensaje" class="celda-estado"></td>
            </tr>
            <tr>
                <td colspan="4" class="intentos">INTENTOS REALIZADOS</td>
            </tr>
            <tr>
                <td colspan="4" class="visor-historial" id="areaHistorial"></td>
            </tr>
        </table>

        <table class="tabla-marcador">
            <tr class="cabecera-numerica">
                <td>1</td><td>2</td><td>3</td><td>4</td><td>5</td>
                <td>6</td><td>7</td><td>8</td><td>9</td><td>10</td>
            </tr>
            <tr class="fila-x">
                <td id="casilla-1"></td><td id="casilla-2"></td><td id="casilla-3"></td>
                <td id="casilla-4"></td><td id="casilla-5"></td><td id="casilla-6"></td>
                <td id="casilla-7"></td><td id="casilla-8"></td><td id="casilla-9"></td>
                <td id="casilla-10"></td>
            </tr>
        </table>
    </div>

    <script src="ProyectoDOMEventos.js"></script>
</body>
</html>
